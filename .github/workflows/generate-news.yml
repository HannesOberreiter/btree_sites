name: Generate News

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate news
        env:
          GITHUB_TOKEN: ${{ secrets.BTREE_RELEASES_READ_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: node scripts/generate-news.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet packages/btree_info/public/news.json packages/btree_info/public/changelog.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/btree_info/public/news.json packages/btree_info/public/changelog.json
          git commit -m "chore: update news and changelog from releases"
          git push

      - name: Upload to Bunny CDN
        if: steps.changes.outputs.changed == 'true'
        env:
          STORAGE_PASSWORD: ${{ secrets.BTREE_INFO_STORAGE_PASSWORD }}
          STORAGE_ZONE_NAME: ${{ vars.BTREE_INFO_STORAGE_ZONE_NAME }}
        run: |
          BASE_URL="https://storage.bunnycdn.com/${STORAGE_ZONE_NAME}"
          for file in news.json changelog.json; do
            echo "Uploading $file..."
            curl -X PUT "${BASE_URL}/${file}" \
              -H "AccessKey: ${STORAGE_PASSWORD}" \
              --data-binary "@packages/btree_info/public/${file}" --fail -s
          done
          echo "Upload complete!"

      - name: Purge BunnyCDN cache
        if: steps.changes.outputs.changed == 'true'
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PULL_ZONE_ID: ${{ vars.BTREE_INFO_PULL_ZONE_ID }}
        run: |
          curl -X POST "https://api.bunny.net/pullzone/${PULL_ZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" --fail -s
          echo "Cache purged."

      - name: Publish news to Facebook
        if: steps.changes.outputs.changed == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then
            echo "FACEBOOK_PAGE_ACCESS_TOKEN not set; skipping Facebook publish."
            exit 0
          fi
          node scripts/publish-facebook-news.js
