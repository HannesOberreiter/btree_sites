name: Generate News

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

# Release events of several repositories can arrive at the same time. Run one
# at a time, so each run starts from the news of the run before.
concurrency:
  group: generate-news
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      # Check out the current main, not the commit of the event, so a queued
      # run sees the news of the run before.
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate news
        env:
          GITHUB_TOKEN: ${{ secrets.BTREE_RELEASES_READ_TOKEN }}
          NEWS_PUBLISH_ISSUE_TOKEN: ${{ github.token }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: node scripts/generate-news.mjs

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet packages/btree_info/public/news.json packages/btree_info/public/changelog.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/btree_info/public/news.json packages/btree_info/public/changelog.json
          git commit -m "chore: update news and changelog from releases"
          git pull --rebase origin main
          git push

      - name: Trigger btree_info deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-btree-info.yml --ref main

