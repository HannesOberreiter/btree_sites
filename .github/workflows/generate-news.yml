name: Generate News

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate news
        env:
          GITHUB_TOKEN: ${{ secrets.BTREE_RELEASES_READ_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: node scripts/generate-news.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet packages/btree_info/public/news.json packages/btree_info/public/changelog.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/btree_info/public/news.json packages/btree_info/public/changelog.json
          git commit -m "chore: update news and changelog from releases"
          git push

      - name: Trigger btree_info deploy
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-btree-info.yml --ref main

      - name: Publish news to Facebook
        if: steps.changes.outputs.changed == 'true'
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then
            echo "FACEBOOK_PAGE_ACCESS_TOKEN not set; skipping Facebook publish."
            exit 0
          fi
          node scripts/publish-facebook-news.js
