name: Deploy btree_info

on:
  push:
    branches: [main]
    paths:
      - "packages/btree_info/**"
      - ".github/workflows/deploy-btree-info.yml"
      - "scripts/upload-bunny.sh"
      - "scripts/upload-bunny.test.mjs"
  workflow_dispatch:

concurrency:
  group: deploy-btree-info
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Test upload safety
        run: node --test scripts/upload-bunny.test.mjs

      - name: Build
        run: pnpm --filter @btree/info build

      - name: Deploy to Bunny Storage
        env:
          STORAGE_PASSWORD: ${{ secrets.BTREE_INFO_STORAGE_PASSWORD }}
          STORAGE_ZONE_NAME: ${{ vars.BTREE_INFO_STORAGE_ZONE_NAME }}
        working-directory: packages/btree_info
        run: bash ../../scripts/upload-bunny.sh dist

      - name: Purge BunnyCDN cache
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          PULL_ZONE_ID: ${{ vars.BTREE_INFO_PULL_ZONE_ID }}
        run: |
          curl -X POST "https://api.bunny.net/pullzone/${PULL_ZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" --fail -s
          echo "Cache purged."

# Required GitHub secrets / variables (set in repo Settings → Secrets and variables):
#   Secrets:  BTREE_INFO_STORAGE_PASSWORD, BUNNY_API_KEY (shared across all sites)
#   Variables: BTREE_INFO_STORAGE_ZONE_NAME, BTREE_INFO_PULL_ZONE_ID
